type: 'application'

workspace:
  inheritedTasks:
    exclude: ['lint']

fileGroups:
  app:
    - 'nest-cli.*'

tasks:
  dev:
    command: bash -c "cd ../.. && nest start nestjs-app --watch"
    

  build:
    command: 'nest build nestjs-app'
    inputs:
      - '@group(app)'
      - '@group(sources)'

